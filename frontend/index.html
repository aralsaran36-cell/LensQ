<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LensQ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared icon sprite (inline, no external files) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1fc8ff"/>
        <stop offset="1" stop-color="#8a5cf6"/>
      </linearGradient>
    </defs>
    <symbol id="eye" viewBox="0 0 64 48">
      <path d="M2 24C10 9 21 3 32 3s22 6 30 21c-8 15-19 21-30 21S10 39 2 24z" fill="url(#lg)"/>
      <path d="M11 24c6-9 13-13 21-13s15 4 21 13c-6 9-13 13-21 13S17 33 11 24z" fill="#ffffff"/>
      <circle cx="32" cy="24" r="10" fill="#1c2150"/>
      <circle cx="28.5" cy="20.5" r="3" fill="#ffffff" opacity=".9"/>
    </symbol>
  </svg>

  <template id="tpl-avatar">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 64 48"><use href="#eye" width="64" height="48"/></svg>
    </div>
  </template>

  <main class="app">
    <header>
      <svg class="logo" viewBox="0 0 76 54" aria-hidden="true">
        <use href="#eye" x="0" y="6" width="64" height="48"/>
        <path d="M62 2l2.2 5.2 5.2 2.2-5.2 2.2L62 16.8l-2.2-5.2-5.2-2.2 5.2-2.2z" fill="#4f7cff"/>
        <path d="M70 15l1.3 3 3 1.3-3 1.3L70 23.6l-1.3-3-3-1.3 3-1.3z" fill="#8a5cf6"/>
      </svg>
      <h1>Lens<span>Q</span></h1>
      <p>Snap or upload a photo, then ask a question about it.</p>
    </header>

    <section id="source-panel" class="source">
      <div class="row">
        <button id="btn-upload" class="btn" type="button">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm1.5 14h13l-4.2-5.4-3.1 4-2.2-2.7L5.5 18zM8.5 7.5a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6z" fill="currentColor"/></svg>
          Upload Image
        </button>
        <button id="btn-camera" class="btn" type="button">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5L7.6 5.5H4a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7.5a2 2 0 0 0-2-2h-3.6L15 3.5H9zm3 5a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 0 1 0-8.4zm0 2a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4z" fill="currentColor"/></svg>
          Open Camera
        </button>
      </div>
      <input id="file-input" type="file" accept="image/*" hidden>
      <input id="camera-fallback" type="file" accept="image/*" capture="environment" hidden>
    </section>

    <section id="camera-panel" class="card" hidden>
      <video id="video" autoplay playsinline muted></video>
      <div class="row">
        <button id="btn-capture" class="btn primary" type="button">Capture</button>
        <button id="btn-cancel-camera" class="btn" type="button">Cancel</button>
      </div>
    </section>

    <section id="preview-panel" class="card" hidden>
      <img id="preview" alt="Selected image preview">
      <button id="btn-clear" class="btn small" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 9h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 9zm4 2v8h1.6v-8H10zm2.4 0v8H14v-8h-1.6z" fill="currentColor"/></svg>
        Remove image
      </button>
    </section>

    <section id="ask-panel" class="card" hidden>
      <label for="question">
        <svg class="ico chat" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" fill="currentColor"/>
          <circle cx="9" cy="10" r="1.3" fill="#fff"/><circle cx="14" cy="10" r="1.3" fill="#fff"/>
        </svg>
        Your question
      </label>
      <textarea id="question" rows="2" maxlength="500"
                placeholder="e.g. What is the total on this bill?"></textarea>
      <button id="btn-ask" class="btn primary" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 11.2L21.5 3l-6.6 18-3.2-7.4-9.2-2.4zm8.8 2.2l1.6 3.7 3.4-9.2-6.6 4.1 1.6 1.4z" fill="currentColor"/></svg>
        Ask
      </button>
    </section>

    <div id="status" role="status" aria-live="polite" hidden></div>
    <div id="error" role="alert" hidden>
      <span id="error-text"></span>
      <button id="btn-retry" class="btn small" type="button" hidden>Retry</button>
    </div>

    <section id="thread" class="thread" aria-live="polite"></section>

    <footer>
      <svg class="ico lock" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9zm3 4a1.6 1.6 0 0 1 .8 3v1.7h-1.6V17a1.6 1.6 0 0 1 .8-3z" fill="currentColor"/></svg>
      <span>Images are processed on our own server and kept in memory only for this session.</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
