# Copy to /etc/nginx/conf.d/lensq.conf on the server, then: nginx -t && systemctl reload nginx
# Replace lensq.example.com with your real domain.

limit_req_zone $binary_remote_addr zone=lensq_analyze:10m rate=10r/m;

upstream lensq_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name lensq.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lensq.example.com;

    ssl_certificate     /etc/letsencrypt/live/lensq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lensq.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 5 MB image limit in the app + margin for multipart overhead
    client_max_body_size 6m;
    client_body_timeout  30s;

    # PRIVACY: keep the upload in memory and stream it to the backend.
    # With buffering on, nginx would write big bodies to client_body_temp_path on disk.
    client_body_buffer_size 6m;
    proxy_request_buffering off;

    # The default access log has only method + path + status (no body, no query text)
    access_log /var/log/nginx/lensq.access.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Only /analyze is rate limited (10 requests/min per IP, burst 5)
    location = /analyze {
        limit_req zone=lensq_analyze burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://lensq_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # model inference can be slow
    }

    location / {
        proxy_pass http://lensq_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}